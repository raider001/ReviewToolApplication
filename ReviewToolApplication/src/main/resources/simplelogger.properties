# SLF4J SimpleLogger configuration

# Default level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=warn

# Application packages: show DEBUG and above
org.slf4j.simpleLogger.log.com.kalynx.serverlessreviewtool=debug

# Third-party: keep quiet
org.slf4j.simpleLogger.log.com.kalynx.swingtheme=warn

# Log format
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# Log to file
org.slf4j.simpleLogger.logFile=System.out

